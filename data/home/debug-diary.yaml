  - activityDate: 2026-10-11
    type: challenge
    info:
      title: "Making sense of ESP32 GPIO pins"
      took: "It took me almost a week to understand the different GPIO pins and where to use which"
      text: "Most projects I came across use GPIO 27 and 13. Those pins are general-purpose and safe to use: they are not strapping pins that affect boot, not input-only like 34 to 39, and not tied to the onboard flash. Wiring a sensor or LED to them won’t get in the way of uploading code or starting the board."
      lesson: "Check a pin’s limits before wiring anything. Some pins are input-only, some affect boot, and the ADC2 pins (which include 13 and 27) can’t read analog values while Wi-Fi is on."