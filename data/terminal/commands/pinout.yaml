name: pinout
label: Pinout
description: ESP32 pin guide, traffic-light edition
quick: true
weight: 35
title: "ESP32 PIN GUIDE (traffic-light edition)"
groups:
  - color: emerald
    label: GO
    note: safe general-purpose pins
    pins: [4, 13, 14, 16, 17, 18, 19, 21, 22, 23, 25, 26, 27, 32, 33]
  - color: amber
    label: CAREFUL
    note: strapping pins, they can affect booting
    pins: [0, 2, 5, 12, 15]
  - color: cyan
    label: INPUT ONLY
    note: no output, no internal pull-ups
    pins: [34, 35, 36, 39]
  - color: red
    label: AVOID
    note: flash (6-11) and USB serial (1, 3)
    pins: [1, 3, 6, 7, 8, 9, 10, 11]
mine:
  - pin: 27
    use: PIR motion sensor
  - pin: 13
    use: status LED
tips:
  - "I2C defaults: SDA = 21, SCL = 22."
  - "ADC2 pins (including 13 and 27) can’t read analog while Wi-Fi is on."
  - "Pin behaviour varies by board, so check your own pinout."