{{- $i := .info | default dict -}}
<span class="mr-2 rounded bg-accent-cyan/15 px-1.5 py-0.5 font-mono text-[11px] text-accent-cyan">Currently reading</span><strong class="font-semibold text-slate-900 dark:text-white">{{ $i.book }}</strong>{{ with $i.page }}<span class="font-mono text-xs nerdy-muted-soft"> · page {{ . }}</span>{{ end }}
{{ with $i.text }}<span class="mt-1 block">{{ . }}</span>{{ end }}
