{{- $i := .info | default dict -}}
<span class="mr-2 rounded bg-accent-purple/15 px-1.5 py-0.5 font-mono text-[11px] text-accent-purple">{{ $i.label | default "Quote" }}</span>
<span class="mt-1 block italic">{{ $i.text }}</span>
{{ with $i.author }}<span class="mt-1 block text-xs nerdy-muted-soft">- {{ . }}</span>{{ end }}
