baseURL: "https://fennyotieno.com/"   # TODO: change to your real domain
locale: en-us
title: fennyotieno
disableKinds:
  - taxonomy
  - term
menus:
  main:
    - name: Articles
      url: /posts/
      weight: 10
markup:
  tableOfContents:
    startLevel: 2
    endLevel: 3
  goldmark:
    renderer:
      unsafe: false
build:
  buildStats:
    enable: true
  cachebusters:
    - source: 'assets/notwatching/hugo_stats\.json'
      target: css
    - source: '(postcss|tailwind)\.config\.(js|mjs|ts)'
      target: css
security:
  exec:
    allow:
      - '^(dart-)?sass$'
      - '^go$'
      - '^git$'
      - '^node$'
      - '^postcss$'
      - '^tailwindcss$'
module:
  imports:
    - path: github.com/hugo-themes/nerdy
  mounts:
    - source: content
      target: content
    - source: data
      target: data
    - source: layouts
      target: layouts
    - source: assets
      target: assets
    - source: static
      target: static
    - source: archetypes
      target: archetypes
    - disableWatch: true
      source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json
